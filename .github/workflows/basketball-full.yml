name: Basketball weekly test
on:
  schedule:
    - cron: "0 6 * * 2"        # Tuesdays 06:00 UTC (07:00 in Lagos): the daily work plus the weekly test (replay, adjustments, gate)
  workflow_dispatch: {}        # also startable by hand from the Actions tab
concurrency: { group: basketball, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python basketball/run.py
        env:
          PYTHONUNBUFFERED: "1"
          BB_MODE: full
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
