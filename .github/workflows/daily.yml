name: Daily refresh
on:
  schedule:
    - cron: "0 5 * * 0,2-6"    # every day except Monday, 05:00 UTC (06:00 in Lagos)
  workflow_dispatch: {}        # also startable by hand from the Actions tab
concurrency: { group: pitchlab, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python pipeline/run.py
        env:
          PYTHONUNBUFFERED: "1"                          # v30: the log shows progress live
          PITCHLAB_MODE: daily
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BSD_KEY: ${{ secrets.BSD_KEY }}
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          PREMIUM_ENABLED: ${{ vars.PREMIUM_ENABLED }}
