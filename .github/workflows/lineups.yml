name: Lineup-time run
on:
  workflow_dispatch: {}        # started by the Cloudflare Worker about 60 minutes before followed or headline kickoffs (and by hand if you like)
concurrency: { group: pitchlab, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python pipeline/run.py
        env:
          PYTHONUNBUFFERED: "1"                          # v30: the log shows progress live
          PITCHLAB_MODE: lineups
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BSD_KEY: ${{ secrets.BSD_KEY }}
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          PLAYERELO_KEY: ${{ secrets.PLAYERELO_KEY }}                  # v36: the PlayerElo experiment (weekly, full run)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}           # v35: team news (optional)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          PIPELINE_KEY: ${{ secrets.PIPELINE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          PREMIUM_ENABLED: ${{ vars.PREMIUM_ENABLED }}
