name = "pitchlab-bot"
main = "worker.js"
compatibility_date = "2025-06-01"

# Every minute: live alerts; every 5 minutes: lineup alerts; every 15 minutes: start a lineup-time run if a followed match is due.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pitchlab"
database_id = "PASTE-YOUR-D1-DATABASE-ID-HERE"

[[r2_buckets]]
binding = "DATA"
bucket_name = "pitchlab"

[vars]
GITHUB_REPO = "YOUR-GITHUB-USERNAME/pitchlab"
SITE_URL = ""
# Secrets (set in the Cloudflare dashboard, never here): TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, PIPELINE_KEY, GITHUB_TOKEN
